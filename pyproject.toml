[project]
name = "so101-exercises"
version = "0.1.0"
description = "Motion stack exercises for the SO-101 on dora: joints, ruckig, IK, LIN, collision, planner"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pin>=3.8",
    "ruckig>=0.19",
    "pyyaml>=6",
    "dora-rs==1.0.1",
    "dora-rs-cli==1.0.1",
    "pyarrow>=17",
    "viser>=1.1",
    "yourdfpy>=0.0.56",
]

[project.optional-dependencies]
real = ["feetech-servo-sdk>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["so101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
