# Everything at once: joint sliders and LIN through the pipeline, gizmo PTP through the planner,
# every plan collision checked, sim or real arm.
nodes:
  - id: ui
    path: ../../nodes/ui.py
    inputs:
      state: driver/state
      plan: planner/plan
      line_plan: collision/plan
      scene: collision/scene
    outputs: [goal, target, line, execute, backend, motion]

  - id: planner
    path: ../../nodes/planner.py
    inputs:
      target: ui/target
      state: driver/state
      ik_response: ik/response
      trajectory_response: trajectory/response
      collision_response: collision/response
    outputs: [ik_request, trajectory_request, collision_request, plan]

  - id: ik
    path: ../../nodes/ik.py
    inputs:
      request: planner/ik_request
      path: trajectory/path
      state: driver/state
    outputs: [response, plan]

  - id: trajectory
    path: ../../nodes/trajectory.py
    inputs:
      motion: ui/motion
      request: planner/trajectory_request
      goal: ui/goal
      line: ui/line
      state: driver/state
    outputs: [response, plan, path]

  - id: collision
    path: ../../nodes/collision.py
    env:
      SCENE: box
    inputs:
      request: planner/collision_request
      plan: trajectory/plan
      line_plan: ik/plan
      state: driver/state
    outputs: [response, plan, scene]

  - id: driver
    path: ../../nodes/driver.py
    inputs:
      tick: dora/timer/millis/20
      trajectory: ui/execute
      backend: ui/backend
    outputs: [state]
