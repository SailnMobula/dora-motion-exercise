# Exercise 6: planner. IK, ruckig and collision answer requests, the planner tries postures in turn.
nodes:
  - id: ui
    path: ../../nodes/ui.py
    inputs:
      state: driver/state
      plan: planner/plan
      scene: collision/scene
    outputs: [target, execute, backend, motion]

  - id: planner
    path: ../../nodes/planner.py
    inputs:
      target: ui/target
      state: driver/state
      ik_response: ik/response
      trajectory_response: trajectory/response
      collision_response: collision/response
    outputs: [ik_request, trajectory_request, collision_request, plan]

  - id: ik
    path: ../../nodes/ik.py
    inputs:
      request: planner/ik_request
    outputs: [response]

  - id: trajectory
    path: ../../nodes/trajectory.py
    inputs:
      motion: ui/motion
      request: planner/trajectory_request
    outputs: [response]

  - id: collision
    path: ../../nodes/collision.py
    env:
      SCENE: box
    inputs:
      request: planner/collision_request
      state: driver/state
    outputs: [response, scene]

  - id: driver
    path: ../../nodes/driver.py
    inputs:
      tick: dora/timer/millis/20
      trajectory: ui/execute
      backend: ui/backend
    outputs: [state]
