# Exercise 1: joint space, no time. Sliders straight to the servos.
nodes:
  - id: ui
    path: ../../nodes/ui.py
    inputs:
      state: driver/state
    outputs: [joints]

  - id: driver
    path: ../../nodes/driver.py
    inputs:
      tick: dora/timer/millis/20
      joints: ui/joints
    outputs: [state]
